'A process has an ID, environment and exit code. A pipe connects stdout of one process to stdin of another. Redirection sends output to a file. Unix permission bits decide who can read, write or execute. Git commits point to a tree snapshot and a parent; branch names move when a new commit is made. Reset moves a name; revert adds a new commit that undoes an earlier change.',
'Use grep to select failed requests, awk to aggregate a column, and jq to parse JSON. Save each step and compare counts. Create a file, commit it, branch, change it, then inspect git log --graph. Delete the branch name and recover its commit through reflog. Write a bootstrap script with a dry-run option before it changes files.',
'Before running a pipeline, predict its output and exit status. If grep finds zero rows, what does the next command receive? What is the difference between moving a branch pointer and recording an undo commit?',
'Follow the provided log-search drill. First write the command plan in words, then connect grep, awk and jq. Build the directory bootstrapper in small steps with quoted variables and explicit error handling.',
'Without copying the example, create a project bootstrap script and repair a repository after a bad rebase. Include a pull request description explaining the change.',
'In a development folder, deliberately search the wrong field, inspect the empty output and exit code, then correct it. Use git reflog to recover a deleted branch. Never rewrite shared history without coordination.',
'Explain one command in plain language, trace bytes through its input/output, and name the failure it can produce. Record symptom, cause, investigation and prevention in a bug journal.',
'Bootstrap script; repo-repair lab: recover a deleted branch, undo a bad rebase and practise removing a secret from history; log-search drill on a supplied access log.',
'Filter a log with grep, awk and jq; recover a deleted branch; explain reset vs revert.',

M('B1','JavaScript runtime','backend',30,'B0 (light)',

'Predict async output order exactly|Explain closures and reference behavior|Find and fix async bugs systematically|Write retry, concurrency and scheduling helpers',
'JavaScript feels sequential when read top to bottom, but asynchronous work lets a program keep responding while slower operations finish. Understanding the runtime replaces timing guesses with predictions.',

'Debug ten planted async bugs: missing await, async forEach, unhandled rejection and races. Read the error, minimize the example, make a hypothesis, then test it. Use Node inspector breakpoints where timing or scope is unclear.',
'Teach back why a closure keeps a variable reachable, and trace one async program without using the phrase “JavaScript is single-threaded” as a substitute for the event-loop explanation.',
'Retry with backoff and timeout; bounded promise pool; event emitter; task scheduler; ten planted async bugs with a bug journal.',

M('B3','Networking and HTTP','backend',25,'B0, B1',
'Network layers and responsibilities|IP addresses, ports and sockets|DNS recursive and authoritative lookup, TTLs and record types|TCP handshake, ordering and flow control|TLS handshake, certificates and limits of encryption|HTTP/1.1 messages, methods, statuses and headers|Cookies and content negotiation|Cache-Control and ETag|Keep-alive and HTTP/2 concepts|CORS from the wire up|Proxies and reverse proxies',
'Trace a request from URL to response|Read raw HTTP messages|Explain 502 vs 504 and browser CORS behavior|Diagnose a failing connection layer by layer',
'A request can fail before it reaches your code. Separating name lookup, connection, encryption, HTTP and application behavior prevents random changes to the wrong layer.',
'A request is a parcel: DNS finds the building address, TCP establishes a reliable delivery route, TLS protects the conversation, and HTTP describes what the sender wants.',
'DNS maps names to records with caches and TTLs. TCP provides ordered bytes over a socket. TLS authenticates a server certificate and encrypts traffic, but cannot make an unsafe endpoint safe. HTTP is a text-based request/response protocol in HTTP/1.1. A reverse proxy accepts a client connection and forwards to an upstream. CORS is a browser-enforced rule based on response headers; it is not server authentication.',
'Build a minimal HTTP/1.1 server using Node net: read request line, headers and Content-Length body; route one path; return correct status and close/keep the connection deliberately. Inspect a public safe endpoint with curl -v, dig and openssl s_client. Compare a browser CORS error with the same request in curl.',
'Predict where a failed request stopped: DNS, TCP, TLS, HTTP or app. Explain why a 502 from a proxy differs from a 504 timeout.',
'Complete the HTTP parser for one request at a time. Use a captured synthetic message to test missing path, malformed length and unknown route.',
'From a fresh terminal, diagnose a refused port and a name resolving to an unexpected address. Write each observation before the next command.',
'Use curl -v, dig, openssl s_client, browser DevTools and a packet capture on your own local or public test endpoint. Never capture traffic you are not authorized to inspect.',
'Draw the path of one request and explain what each layer knows and does not know. Describe why a request can succeed in Postman or curl but be blocked by browser CORS.',
'HTTP/1.1 server on Node net; traffic inspection notes with command outputs and a layer-by-layer diagnosis.',
'Trace an HTTPS request; read a raw HTTP message; explain 502 vs 504 and CORS; diagnose with curl -v and dig.',
'http,cloudflare,net', 'Use only systems you own or are explicitly allowed to inspect.'),
M('B4','Node internals, Express and basic testing','backend',40,'B1, B3',
'Node architecture: V8 and libuv|Modules, fs and Buffers|Streams and backpressure|http module|Middleware pattern and routing|Error-handling middleware|Request validation and configuration|Structured logging|Tests and arrange–act–assert|node:test or Vitest|Unit tests and Supertest route tests|Test isolation and reproducing bugs as failing tests',
'Explain how Express middleware works|Build a validated API with error handling|Test pure logic and HTTP routes|Debug with inspector and structured logs',
'Frameworks are useful because they package repeated plumbing. Building a tiny version first shows which parts Express is doing and makes framework behavior less mysterious.',
'A middleware chain is a row of stations. Each station can add context, finish the request, or pass it onward; an error takes a separate path to error middleware.',
'Node runs JavaScript on V8 and uses libuv and the OS for asynchronous operations. Buffers hold bytes; streams process bounded chunks. Backpressure prevents a fast producer from overwhelming a slow consumer. Express composes functions around a request/response pair. A test arranges state, performs an action and checks observable behavior.',
'Implement a mini router and middleware runner for two routes. Add one validation middleware and one error middleware. Then rebuild the same small notes API in Express. Write a failing test for an observed bug before applying the fix, and make the test pass afterward.',
'Predict whether a middleware calls next, sends a response or throws. If a readable stream is faster than its destination, identify where backpressure must pause production.',
'Fill missing branches in a middleware chain and create tests for valid input, malformed input, missing route and thrown error. Keep fixtures isolated between tests.',
'Build a small API with validation, logging and tests, then diagnose a request using a breakpoint and request ID.',
'Use Node inspector breakpoints and logs to trace a request. Turn each fixed bug into a regression test. Test only on local development data.',
'Explain how a request reaches a route, what next() means, and how an error differs from a normal response. Rebuild one middleware from a blank file.',
'Mini Express-style router built from scratch, then the same notes or book-loans API rebuilt with Express, validation, logging and tests.',
'Write a tiny HTTP server and middleware chain without Express; explain streams and backpressure; write a failing then passing test.',
'node,streams,test,express', 'Begin with your own mini-router before relying on Express abstractions.'),
M('B5','API design and validation','backend',25,'B4',
'Resource modelling and URI design|Safe and idempotent method semantics|Status codes and consistent errors|RFC 9457 Problem Details|Offset vs cursor pagination|Filtering and sorting|Versioning|Idempotency keys|Rate-limit headers|OpenAPI|TypeScript types, interfaces, narrowing and strict mode|Inferring types from validation schemas',
'Turn requirements into an API contract before coding|Implement against a documented contract|Defend status, pagination and idempotency choices',
'An API is a promise between programs. A clear contract lets a client and server evolve independently and makes failures predictable.',
'Treat an API like a menu: resource names identify what exists, methods identify the requested action, and the response describes the outcome in a stable shape.',
'Safe requests do not change server state. Idempotent requests have the same intended effect when repeated. Cursor pagination continues from a stable ordering key; offset pagination counts from the beginning and can shift under concurrent writes. Runtime schemas validate real bytes, while TypeScript types help during development and disappear after compilation.',
'Spec a library-lending API first: list resources, methods, request/response shapes, status codes and error schema in OpenAPI. Add cursor pagination and an idempotency key to a create operation. Implement only after reviewing the contract, then run a contract test.',
'If a client retries after a timeout, which operation can safely repeat? What can change between page 1 and page 2 when new rows are inserted?',
'Critique a flawed API specification, write an OpenAPI fragment and implement schema validation with inferred TypeScript types.',
'Add filtering, sorting and cursor pagination; write a contract test that detects a response drift.',
'Replay a request with the same idempotency key and inspect logs by correlation ID. Diagnose a duplicated operation or a mismatched contract in development.',
'Explain safe vs idempotent in your own words, why runtime validation is still needed in typed code, and how clients use a stable error format.',
'Spec-first TypeScript library-lending API with OpenAPI, validation, idempotency behavior and contract test.',
'Critique a flawed API design; write an OpenAPI fragment; explain idempotency and cursor pagination.',
'http,openapi,rfc,ts,zod,stripe', 'Level 5 tasks use a new API scenario and no pre-attempt hints.'),
M('B6','SQL and relational design','backend',40,'B0 (psql), B5',
'Relational model, keys and constraints|Data types|Normalisation from 1NF to BCNF; when to denormalise|Joins, aggregates, subqueries and CTEs|Window functions introduction|B-tree, composite, partial and covering indexes|Query planner and EXPLAIN ANALYZE|N+1 problem|Migrations|Node pg driver and connection pooling|SQL injection and parameterized queries|ORMs vs query builders and their limits',
'Design a schema from requirements on paper|Write and optimise useful queries|Read a query plan and explain index choices|Use Postgres safely from Node',
'Data outlives requests and concurrent processes. A relational database gives one place to enforce important rules even when application code has bugs.',
'A database schema is a set of labeled tables with explicit links. Constraints are guardrails at the storage boundary; indexes are extra maps that trade write/storage cost for faster reads.',
'Keys identify rows and foreign keys enforce relationships. Normalisation reduces update anomalies by storing one fact in one place. Joins combine related rows. The planner estimates alternative plans from statistics. EXPLAIN ANALYZE runs a query and reports actual work. An index helps only when its ordering matches a useful filter/order and the planner expects it to save cost.',
'Design students, classes and enrolments on paper. Create constraints and seed representative data. Write an analytics query, inspect EXPLAIN ANALYZE, add one candidate index, repeat with the same dataset and compare buffers/time. Replace the in-memory repository through parameterized pg queries and a bounded pool.',

'Complete pgExercises for joins and aggregates, then draw a link shortener schema and implement migrations before routes.',
'Seed about one million synthetic clicks and compare index strategies on a consistent query. Document the plan before and after.',
'Use psql, planner output and Postgres logs to investigate an intentionally slow query. Check whether N+1 calls or a missing selective index explain the symptom.',
'Explain why a constraint protects concurrent requests better than a frontend check. Interpret one query plan in plain words and name the cost of your index.',
'Link shortener with click analytics, paper schema, migrations, million-row synthetic dataset and measured EXPLAIN experiments.',
'Design a schema from requirements; write joins and aggregates; read an EXPLAIN plan; explain why an index is not used.',
'pg,pgex,sqlbook', 'Use synthetic data only. Compare measurements under repeatable conditions.'),
M('B7','Transactions, concurrency and migrations','backend',30,'B6',

'Explain transaction guarantees and limits|Reproduce a race deliberately|Fix the same race using different techniques|Choose a safe migration strategy',
'Two individually correct requests can combine into an incorrect result when they overlap. Concurrency concepts explain how to make the whole operation safe.',
'A transaction is a small protected work session. Locks are numbered tickets for shared resources; isolation determines which intermediate facts each session can observe.',
'Postgres MVCC lets readers see snapshots while writers create new row versions. Isolation levels trade concurrency for anomaly prevention. Row locks serialize access to selected rows. Constraints make invariants enforceable even when requests race. Expand-and-contract migrations add a compatible shape before application rollout, then remove the old shape later.',
'Create an inventory row with one item left. Send two concurrent reservation requests and observe oversell. Fix once with a conditional UPDATE/constraint, once with SELECT FOR UPDATE, and compare correctness, blocking and failure behavior. Reproduce a lost update in two psql sessions before reading the isolation explanation.',

'Complete a two-session reproduction script. Add a test that reliably catches the race before fixing it.',
'Build a ledger or inventory API with planted double-spend and oversell defects; compare constraint, lock and isolation-level remedies.',
'Inspect pg_stat_activity and pg_locks, then interpret a deadlock log. Use local Postgres with synthetic records only.',
'Explain what your chosen transaction guarantees, what it does not, and why the selected fix fits the invariant.',
'Ledger or inventory API with reproducible races, parallel request scripts, multiple fixes and comparison write-up.',
'Explain isolation anomalies; reproduce and fix a lost-update race; explain a deadlock.',
'pg', 'Concurrency faults must run on local development data, never a live system.'),
M('B8','Authentication and security','backend',35,'B3, B5, B6',
'Threat modelling basics|Password salts, work factors, bcrypt, scrypt and Argon2|Sessions vs JWT; storage, revocation and refresh tokens|HttpOnly, Secure and SameSite cookies|RBAC and ABAC|OAuth 2.0 authorization code with PKCE|OpenID Connect overview|CORS and CSRF|TLS practice|Security headers and CSP|OWASP Top 10: injection, broken access control, SSRF and others|Secrets management and dependency audits|Login rate limiting|Security-event logs',
'Threat-model a small service|Build authentication and authorization correctly|Explain session/JWT tradeoffs|Find and fix common vulnerabilities',
'Authentication features handle identity and valuable data, so small boundary mistakes can become account takeover or data exposure.',
'Authentication asks “who is this caller?” Authorization asks “what may this identity do?” A password hash is a one-way lock check, not a secret that should be decrypted later.',
'Password hashing algorithms use salts and adjustable work factors to make guessing expensive. Sessions store revocable server state; JWTs are signed claims but are not encrypted and can be hard to revoke. Cookie flags reduce browser exposure. CSRF exploits ambient credentials; CORS controls browser read access. OAuth delegates authorization and OIDC adds identity. Threat models connect assets, actors, trust boundaries and abuse cases.',
'Draw a data-flow diagram for a small library service. Register, hash and store a password; login with a generic failure; create a secure session; add a teacher-only route and tests for anonymous, student and teacher. Inspect cookies and headers. Review your own earlier service for five concrete issues.',

'Inspect tokens, cookies and headers; replay safe requests against your own code; audit dependencies. Never attack a third-party system.',

'Explain safe password storage; compare sessions and JWT; find vulnerabilities in a code sample; explain CSRF and CORS.',

M('B9','Advanced testing, TDD, CI and debugging','backend',30,'B4, B6, B7',
'Test pyramid and tradeoffs|Real Postgres integration tests with Docker or Testcontainers|Factories and test data|Stubs, fakes and mocks; when mocks hide bugs|Contract tests|TDD red-green-refactor|Property-based testing introduction|Coverage limits|Flaky tests|GitHub Actions service containers, caching and matrices|Pre-commit hooks|Scientific debugging|git bisect|Short post-fix notes',
'Choose test levels that establish confidence|Build a feature test-first|Keep CI green and fast|Debug unfamiliar failures systematically',
'Tests are executable examples that help detect regressions. The goal is not a large number; it is confidence in important behavior.',
'A test suite is a set of lenses at different distances: unit tests inspect small pieces; integration tests check real boundaries; end-to-end checks confirm a user path.',
'TDD cycles red, green, refactor. Test doubles isolate dependencies but can hide contract failures. Property tests generate many inputs and shrink a failing case. CI starts from a clean checkout, installs pinned dependencies and runs repeatable checks. Scientific debugging reproduces, minimizes, hypothesizes, tests, fixes and adds a regression test.',
'Choose an API behavior, write a failing test first, implement the smallest change, then refactor. Run the same suite against a disposable Postgres service in CI. Break a historical commit intentionally and use git bisect to locate it.',
'Which test would catch a SQL constraint regression that a mocked repository misses? How does shrinking help when a property test finds a long failing input?',
'Retrofit one integration test and workflow. Implement a small rate limiter using red-green-refactor; use fakes only for a boundary that is expensive or nondeterministic.',
'Run a six-regression debugging gauntlet using bisect, logs and a debugger; record reproduction, hypothesis and regression test for each fix.',
'Use a test database, factories and deterministic inputs. Diagnose flakes by separating shared state, timing and external dependencies.',
'Explain what each test level proves and one thing it cannot prove. Defend a mock/fake choice using the behavior under test.',
'Integration suite and CI retrofit for B6/B7 services; a test-first rate limiter; six regression debugging gauntlet.',
'Decide test levels; write a function test-first; find a regression with git bisect.',
'actions,test,fastcheck,mit,progit'),
M('B10','Deployment, configuration and recovery','backend',30,'B0, B8, B9',
'Containers vs virtual machines|Multi-stage Dockerfiles and layers|Non-root users|Docker Compose|Twelve-factor configuration|Secrets handling|Health and readiness checks|Nginx reverse proxy, TLS termination, timeouts and upstreams|CI/CD build, test, publish and deploy|Rolling and blue-green concepts|Log collection|Logical/physical backups and WAL/PITR concepts|Restore drills|RPO and RTO',
'Package and deploy reproducibly|Keep configuration and secrets outside images|Back up a database and prove restoration works|Diagnose staging failures from logs',
'A service is not complete when it works on one laptop. Deployment makes the runtime reproducible; recovery practice proves the data can return after a failure.',
'An image is a recipe and filesystem snapshot; a container is one running instance. A backup is only a promise until a restore is timed and checked.',
'Docker layers cache build steps. Multi-stage builds separate build tools from runtime. Twelve-factor configuration separates environment-specific settings. Readiness means a service can serve; liveness means it is alive. Reverse proxies route and terminate TLS. RPO is acceptable data loss; RTO is target recovery time.',
'Containerize the link shortener and ledger. Configure Compose with Postgres, health checks and persistent storage. Deploy to a local VM acting as staging. Automate a nightly backup and restore it to a clean database while measuring elapsed time and validating rows.',
'If the process is healthy but cannot serve requests, which health check should fail? If backup age is 20 hours, what does that imply for an 8-hour RPO?',
'Write a non-root multi-stage Dockerfile and a configuration checklist. Run it with a sample env file containing no real secrets.',
'Build a CI/CD pipeline to the staging VM. Practise stopping the staging database, breaking sample config and filling a disposable disk; recover each with logs.',
'Use docker logs/exec, Nginx logs, journalctl and ss. Fault scripts must refuse to run unless APP_ENV is dev or staging; snapshot the VM first.',
'Explain image vs container, readiness vs liveness, backup vs restore, and how your measured recovery meets stated RPO/RTO.',
'Containerized staging deployment, nightly backup, timed restore drill and staging-only diagnosis exercises.',
'Write a multi-stage Dockerfile; explain twelve-factor config; configure Nginx; restore a database from a dump.',
'docker,twelve,nginx,pgbackup', 'Every destructive fault exercise is dev/staging only, synthetic-data only and reversible.'),
M('B11','Reliability and performance','backend',35,'B3, B6, B10',
'HTTP caching and CDNs conceptually|Redis cache-aside, TTL, stampedes and invalidation|Token bucket and sliding-window rate limits|Queues and workers|Exponential backoff and jitter|Idempotent consumers and dead-letter queues|Timeouts and backpressure|Circuit breakers and bulkheads|Graceful degradation and shutdown|Logs, metrics and traces; RED and USE|Prometheus, Grafana, SLOs and alerting basics|CPU flame graphs, event-loop lag and heap snapshots|k6 baseline, stress and soak|Capacity reasoning',
'Add cache and queue behavior for measured reasons|Protect systems from overload and slow dependencies|Instrument a service|Find and fix bottlenecks using evidence',
'Reliability is what users experience when dependencies slow down, traffic increases or a task fails halfway through. Patterns help only when they address a measured failure mode.',
'A cache is a short-lived copy, not the source of truth. A queue is a waiting room that separates accepting work from completing it. A bulkhead limits how much one failure can spread.',
'TTL bounds cache staleness but does not guarantee invalidation. Retries amplify load unless timed, jittered and bounded. Idempotent consumers tolerate redelivery. RED measures request rate, errors and duration; USE measures utilization, saturation and errors. Profiling identifies where time or memory goes; k6 describes behavior under a defined load.',
'Add cache-aside to a read path, measure repeated latency, then inject Redis downtime in staging. Queue a notification with bounded retries and a dead-letter route. Add request metrics and build a baseline k6 test before profiling and changing one bottleneck.',
'If 100 requests fail and all retry at the same instant, what load pattern follows? What remains stale if a write forgets to invalidate a cache key?',
'Implement a TTL cache and one idempotent job handler. Sketch a dashboard with request rate, error rate and p95 latency before starting load tests.',
'Build a notification/job service with retry, dead-letter handling, metrics and a k6 report showing baseline, bottleneck, fix and rerun.',
'In staging only, take Redis down, slow a database query or create a retry storm. Use logs, event-loop metrics, flame graphs and k6 output to isolate the cause.',
'Justify a cache/queue from measurements and state failure behavior. Explain how your change affected latency, load and correctness.',
'Notification/job service with observability, local dashboards and measured load-test improvement report.',
'Implement cache-aside with TTL; explain backoff, backpressure and circuit breakers; read a flame graph and k6 result.',
'redis,bull,sre,prom,grafana,k6,flame', 'Fault injection must use development/staging and synthetic data only.'),
M('B12','Architecture and system design','backend',25,'B6, B7, B11',
'Requirements and capacity estimates|Monolith vs modular monolith vs services|Layered and hexagonal structure|Data-model choices|Caching layers|Queues and asynchronous design|Replication, read replicas, partitioning and sharding|CAP and consistency concepts|Failure modes|Architecture Decision Records|Design documents|API evolution and migration strategies|Cost awareness|Published postmortems',
'Write a system design from requirements|Defend decisions with numbers and tradeoffs|Anticipate failure modes|Critique another design constructively',
'Architecture is a set of consequential choices under constraints. Starting with a monolith often preserves feedback speed until measurements justify extra boundaries.',
'A design document is a map of promises and limits. Capacity estimates are rough compass readings, not precise predictions; their value is exposing assumptions.',
'Estimate request rate, storage growth and hot paths from user behavior. A modular monolith separates internal responsibilities without network failure modes. Replicas improve read capacity but introduce lag. CAP is about tradeoffs during a network partition, not a universal label for databases. ADRs record context, decision and consequences.',
'Design a 10,000-user system: state assumptions, estimate daily active users and peak requests, sketch components and data, identify three failures, and record major decisions. Critique three published postmortems before proposing your capstone scope.',
'If average load is 20 requests/sec and a 10x peak is possible, what do you need to measure next? What new failure mode appears when a module becomes a network service?',
'Fill an ADR template for database choice and one design alternative. Draw one request path and one failure path.',
'Produce a 10,000-user design with diagrams, estimates, decision records and failure analysis; defend it aloud and agree a scoped capstone proposal with your mentor.',
'Read incident timelines from published postmortems and distinguish triggering event, contributing conditions, detection gap and recovery action.',
'Defend choices with measured evidence, name alternatives and say what changes at 10x scale. Explain one design without relying on architecture buzzwords.',
'Written design for a 10,000-user system, three postmortem critiques and capstone proposal.',
'Produce a capacity estimate; justify monolith vs services; write a decision record.',

M('B13','Independent backend capstone','backend',60,'B0–B12 mastery',

'Scope is 6–10 tables, 15–25 endpoints, one background worker and one simulated external integration. Candidate defaults: event ticketing with expiring holds, clinic appointments, or shop orders/inventory. No frontend or real users required. Evidence includes design, security, tests, deployment, monitoring, k6, timed restore, runbook, measured improvement and level-5 defence.',
'Choose a candidate after B12 approval. Write the design first, then vertical slices with tests. Deploy only to your local staging VM. Create dashboards and thresholds before the live staging incident. Snapshot the VM, use synthetic data and verify the fault script checks APP_ENV before it runs.',

'Build, deploy, monitor, load-test, back up, restore, troubleshoot and improve. Keep before/after measurements and commit history.',

'No pre-check. B13 is gated by capstone evaluation.',

M('B14','Applying skills to your SMS and portfolio','backend',30,'B13',

{stage:1,name:'Complexity analysis',why:'Complexity predicts how work grows as input grows; it is a way to reason before a slow program surprises you.',how:'Count the dominant repeated work, ignore constant factors for large n, and state time and extra space separately.',example:'A loop over n values performs about n steps: O(n). Two nested loops over the same n items may perform n² comparisons: O(n²).',task:'Count operations in a nested loop and in a single pass. State best, typical or worst case only when the algorithm actually differs.',debug:'Find an accidental nested scan in a small function; compare its operation count at n=10 and n=100.',code:'function sum(values) {\n  let total = 0;\n  for (const value of values) total += value;\n  return total;\n}'},
{stage:1,name:'Arrays and strings',why:'Ordered data is the simplest useful structure and appears in nearly every input format.',how:'Use indexes to access positions; a scan costs linear time, while inserting near the front shifts later values.',example:'Walk a string left to right while tracking a count. State the loop invariant: everything before the index has already been counted.',task:'Find the first repeated character and explain how input order affects the answer.',debug:'An off-by-one loop skips the final element. Trace indexes on an empty, one-item and two-item input.',code:'function countVowels(text) {\n  let count = 0;\n  for (const ch of text.toLowerCase()) {\n    if ("aeiou".includes(ch)) count++;\n  }\n  return count;\n}'},
{stage:1,name:'Hash maps and sets',why:'Repeatedly scanning a list to find a value is slow; a hash table gives fast average lookup.',how:'A hash function maps keys to buckets. Collisions are resolved internally; correctness still depends on key equality.',example:'For a two-sum search, store previously seen values. For each x, check whether target-x is already present.',task:'Design a frequency counter for words and specify how punctuation and letter case are handled.',debug:'Two distinct inputs collapse to the same normalized key. Inspect the normalization rule before blaming the map.',code:'function frequencies(values) {\n  const counts = new Map();\n  for (const value of values) counts.set(value, (counts.get(value) || 0) + 1);\n  return counts;\n}'},
{stage:1,name:'Two pointers',why:'Two positions can coordinate a scan and avoid rechecking every pair.',how:'Place pointers according to an invariant, then move the pointer whose movement cannot discard a valid answer.',example:'On a sorted array, compare the left and right values to a target sum. Too small means move left; too large means move right.',task:'Find whether a sorted array contains a pair with target sum. Explain why each pointer move is safe.',debug:'The code moves both pointers after a mismatch. Construct an input where this skips the only valid pair.',code:'function hasPair(sorted, target) {\n  let left = 0, right = sorted.length - 1;\n  while (left < right) {\n    const sum = sorted[left] + sorted[right];\n    if (sum === target) return true;\n    if (sum < target) left++; else right--;\n  }\n  return false;\n}'},
{stage:1,name:'Sliding window',why:'Many contiguous-range problems can be solved by updating one window instead of recomputing every range.',how:'Maintain a window invariant. Expand the right edge, then shrink the left edge while the condition is invalid.',example:'For a positive-number array, keep a running sum and shrink while it exceeds a limit. Each index moves at most twice.',task:'Find the shortest contiguous positive-number range whose sum is at least a target. State why positivity matters.',debug:'Negative values break the simple shrink rule. Find a counterexample and describe what additional structure could help.',code:'function maxWindowSum(values, width) {\n  if (width > values.length) return null;\n  let sum = values.slice(0, width).reduce((a, b) => a + b, 0);\n  let best = sum;\n  for (let right = width; right < values.length; right++) {\n    sum += values[right] - values[right - width];\n    best = Math.max(best, sum);\n  }\n  return best;\n}'},
{stage:1,name:'Stacks and queues',why:'The order in which work is processed matters: last-in-first-out differs from first-in-first-out.',how:'A stack pushes/pops the newest item; a queue enqueues and removes the oldest. A deque supports both ends.',example:'Use a stack to match opening and closing brackets. Use a queue for breadth-first exploration.',task:'Validate brackets in a string and explain what the top of the stack means at each character.',debug:'A closing bracket arrives when the stack is empty. Trace the failure and specify the correct rejection case.',code:'function validBrackets(text) {\n  const pairs = { ")": "(", "]": "[", "}": "{" };\n  const stack = [];\n  for (const ch of text) {\n    if ("([{ " .includes(ch) && ch !== " ") stack.push(ch);\n    else if (pairs[ch] && stack.pop() !== pairs[ch]) return false;\n  }\n  return stack.length === 0;\n}'},
{stage:2,name:'Linked lists',why:'Linked nodes make local insertions cheap when you already have the node, but accessing an arbitrary position requires walking.',how:'Each node stores a value and a reference to the next node; list operations update links carefully.',example:'Reverse a list by keeping previous, current and next references so no remaining node is lost.',task:'Remove a node by value and handle head, middle, tail and absent cases.',debug:'A pointer is overwritten before saving next. Draw the links for three nodes and identify the lost suffix.',code:'function reverseList(head) {\n  let previous = null, current = head;\n  while (current) {\n    const next = current.next;\n    current.next = previous;\n    previous = current;\n    current = next;\n  }\n  return previous;\n}'},
{stage:2,name:'Recursion',why:'Recursion expresses a problem as smaller versions of itself, especially for trees and divide-and-conquer.',how:'A recursive function needs a base case and a step that moves toward it. Each call has its own stack frame.',example:'Sum a nested tree by adding the current value to the sums of its children.',task:'Write a recursive depth function for a tree and state the maximum call depth risk.',debug:'The recursive call does not shrink the input. Trace the repeated state and repair the progress measure.',code:'function factorial(n) {\n  if (n < 0) throw new Error("n must be non-negative");\n  if (n <= 1) return 1;\n  return n * factorial(n - 1);\n}'},
{stage:2,name:'Binary search',why:'A sorted search space can be cut in half repeatedly instead of scanned end to end.',how:'Keep a range that is guaranteed to contain the answer. Each comparison discards half while preserving the invariant.',example:'Use a half-open interval [low, high). Stop when low equals high; calculate mid without relying on unsafe arithmetic in fixed-width languages.',task:'Find the first index whose value is at least a target, including duplicates and absent targets.',debug:'The loop never ends when low equals mid. Trace a two-element range and choose a progress-preserving update.',code:'function lowerBound(values, target) {\n  let low = 0, high = values.length;\n  while (low < high) {\n    const mid = low + Math.floor((high - low) / 2);\n    if (values[mid] < target) low = mid + 1; else high = mid;\n  }\n  return low;\n}'},
{stage:2,name:'Sorting',why:'Sorting creates order that makes searching, grouping and comparison easier.',how:'Algorithms trade comparisons, memory and stability differently. Merge sort divides and merges; quicksort partitions around a pivot.',example:'Merge two sorted halves by repeatedly selecting the smaller front item, then append the remainder.',task:'Explain how comparison count and extra space differ for insertion sort and merge sort.',debug:'A merge step advances the wrong pointer and duplicates an item. Use a tiny input and track both cursors.',code:'function merge(left, right) {\n  const result = []; let i = 0, j = 0;\n  while (i < left.length && j < right.length) {\n    result.push(left[i] <= right[j] ? left[i++] : right[j++]);\n  }\n  return result.concat(left.slice(i), right.slice(j));\n}'},
{stage:2,name:'Trees and binary search trees',why:'Trees represent hierarchy and support ordered operations when their shape stays balanced.',how:'Each node points to children. In a BST, left values are smaller and right values larger; traversal order follows this invariant.',example:'In-order traversal of a BST returns sorted values. Search follows one branch at each comparison.',task:'Insert values and draw the resulting tree; explain the worst case when input arrives sorted.',debug:'A recursive traversal omits one child. Use a tree with a single right child to expose it.',code:'function inorder(node, out = []) {\n  if (!node) return out;\n  inorder(node.left, out);\n  out.push(node.value);\n  inorder(node.right, out);\n  return out;\n}'},
{stage:3,name:'Graphs: BFS and DFS',why:'Relationships often form networks rather than a simple list or tree.',how:'Represent vertices and edges with adjacency lists. BFS uses a queue for shortest paths in unweighted graphs; DFS explores deeply with a stack or recursion.',example:'Starting from a user, BFS discovers all accounts within k friendship steps.',task:'Traverse a graph with cycles and return the shortest unweighted distance to a target.',debug:'A node is marked visited only after processing; duplicate queue entries grow and cycles can loop. Identify the right time to mark it.',code:'function bfs(graph, start) {\n  const distance = new Map([[start, 0]]), queue = [start];\n  for (let i = 0; i < queue.length; i++) {\n    const node = queue[i];\n    for (const next of graph.get(node) || []) if (!distance.has(next)) {\n      distance.set(next, distance.get(node) + 1); queue.push(next);\n    }\n  }\n  return distance;\n}'},

ade up. Keep at least two sessions weekly.</div><div class="card"><div class="module-meta"><span class="tag">B2</span><span class="tag '+(passed('B2')?'done':'warn')+'">'+escapeHtml(statusOf(moduleByCode('B2')))+' </span></div><h3>DSA diagnostic, lesson and mastery record</h3><p>Pre-check: solve two problems unaided, state complexity and explain how a hash map works. DSA mastery remains separate from the backend gates.</p><button class="btn secondary" data-module="B2" data-precheck="false">Open B2 learning record</button></div><div class="grid2"><div class="card"><h3>Stage progression</h3>'+stages.map(n=>'<p><span class="tag '+(stage===n?'done':'')+'">Stage '+n+'</span> '+['Complexity, arrays/strings, maps/sets, two pointers, sliding window, stacks/queues','Linked lists, recursion, binary search, sorting, trees/BST','Graphs BFS/DFS, heaps, backtracking, introductory dynamic programming','Mixed timed sets and mock interviews'][n-1]+'</p>').join('')+'</div><div class="card"><h3>DSA progress</h3><div class="stat">'+Object.values(db.dsa).filter(x=>x&&x.submitted).length+'</div><div class="statlabel">Sessions with saved attempts</div><p class="footnote">Keep a solutions notebook with approach, complexity and mistakes. Problems solved with hints are not counted as unaided.</p></div></div><div class="sectionhead"><div><h2>This week’s DSA sessions</h2><p>Each record needs an attempt; a timer or checkbox alone is not evidence of solving.</p></div></div><div class="grid2">'+weekDsa.map((s,i)=>'<div class="card"><div class="module-meta"><span class="tag">'+s.day+'</span><span>30 minutes</span></div><h3>'+s.task+'</h3><p class="footnote">Pattern: '+escapeHtml(pattern.name)+'</p><div class="field"><label for="dsaw-'+i+'">Approach, code/result, complexity and mistake</label><textarea id="dsaw-'+i+'">'+escapeHtml((db.dsa[s.key]||{}).text||'')+'</textarea></div><div class="row"><button class="btn secondary" data-dsa-submit="'+s.key+'" data-dsa-pattern="'+escapeHtml(pattern.name)+'" duce DSA below two sessions per week.</p><div class="grid2">'+[0,1,2,3].map(i=>'<div class="card"><b>Plan week '+(w+i)+'</b><p>'+escapeHtml(i===0?'Current active modules and due reviews':i===1?'Continue only after prerequisite evidence':i===2?'Revisit weakness register and project evidence':'Recompute after the next gate or pre-check')+'</p></div>').join('')+'</div><div class="field"><label for="weekreview">Weekly journal · what I learned, what broke, what comes next</label><textarea id="weekreview">'+escapeHtml(db.weeklyJournal&&db.weeklyJournal[w]||'')+'</textarea></div><button class="btn secondary" data-journal="'+w+'">Save weekly journal</button></div>'}
function weeksElapsedLight(){const start=new Date('2026-11-09T00:00:00');const d=new Date();return (d.getMonth()===11&&d.getDate()>=29)||(d.getMonth()===2&&d.getDate()>=29)}
function currentDsaStage(){let stage=1;for(let n=1;n<4;n++){const patterns=DSA.filter(p=>p.stage===n),ready=patterns.length>0&&patterns.every(p=>Object.values(db.dsa).filter(x=>x&&x.submitted&&x.pattern===p.name).length>=2);if(ready)stage=n+1;else break}return stage}
function progressPage(){const events=db.history.slice(0,18),weak=db.weaknesses.filter(w=>!w.cleared),due=dueReviews();const assignments=Object.entries(db.assignments).filter(([,a])=>a&&a.submitted).length;const attempts=Object.values(db.attempts).filter(a=>a&&a.text).length,debugCount=Object.values(db.debugging||{}).filter(a=>a&&a.submitted).length,views=Object.values(db.lesson).filter(a=>a&&a.viewed).length;return '<div class="modulehead"><div><div class="eyebrow">Learner record · local to this browser</div><h1>Evidence & review</h1><p class="lead">Viewed content, attempted exercises, submitted assignments and demonstrated mastery are recorded separately.</p></div><button class="btn secondary" id="exportData">Export learning record</button></div><div class="statusbox">Your learning data is stored in this browser on this device. It is not synchronized across devices. Export a backup periodically. The previous six-week records remain archived and do not count toward new-course mastery.</div><div class="cards"><div class="card"><div class="stat">'+views+'</div><div class="statlabel">Modules viewed · not completed</div></div><div class="card"><div class="stat">'+attempts+'</div><div class="statlabel">Exercise attempts saved</div></div><div class="card"><div class="stat">'+assignments+'</div><div class="statlabel">Assignment evidence submitted</div></div></div><div class="sectionhead"><div><h2>Mastery ledger</h2><p>Four part scores, gate outcome and weakness notes.</p></div></div><div class="tablewrap"><table><thead><tr><th>Module</th><th>Status</th><th>Explain</th><th>Debug</th><th>Modify</th><th>Justify</th><th>Score</th><th>Weak points</th></tr></thead><tbody>'+allModules.map(m=>{const r=db.gates[m.code]||db.prechecks[m.code]||{};return '<tr><td>'+m.code+' · '+escapeHtml(m.title)+'</td><td>'+escapeHtml(statusOf(m))+'</td><td>'+(r.scores?r.scores.explain:'—')+'</td><td>'+(r.scores?r.scores.debug:'—')+'</td><td>'+(r.scores?r.scores.modify:'—')+'</td><td>'+(r.scores?r.scores.justify:'—')+'</td><td>'+(r.total||'—')+'</td><td>'+weak.filter(x=>x.code===m.code).map(x=>escapeHtml(x.part+': '+x.note)).join('<br>')+'</td></tr>'}).join('')+'</tbody></table></div><div class="sectionhead"><div><h2>Weakness register & spaced revision</h2><p>Gate items return at 1, 3 and 8 weeks; an item clears after two spaced passes.</p></div></div><div class="grid2">'+(weak.length?weak.map(w=>'<div class="card"><div class="module-meta"><span class="tag warn">'+escapeHtml(w.code)+'</span><span>'+escapeHtml(w.part)+'</span><span>Passes '+w.passes+'/2</span></div><p>'+escapeHtml(w.note||'Review this requirement with a different problem set.')+'</p><p class="footnote">Retest after '+escapeHtml(w.nextRetest?new Date(w.nextRetest).toLocaleString():'48 hours of practice')+'.</p></div>').join(''):'<div class="card">No open weaknesses have been recorded. A missing record does not mean a module was assessed.</div>')+(due.length?due.map(d=>'<div class="card"><span class="tag">Revision due</span><h3>'+escapeHtml(d.code)+' · '+escapeHtml(d.part)+'</h3><p>'+escapeHtml(d.prompt)+'</p><div class="field"><label>Retrieval-practice attempt</label><textarea id="revision-'+escapeHtml(d.key)+'">'+escapeHtml((db.revision[d.key]||{}).text||'')+'</textarea></div><button class="btn secondary" data-revision="'+escapeHtml(d.key)+'">Save revision attempt</button><span class="footnote">Attempt saved; not independently reviewed.</span></div>').join(''):'')+'</div><div class="sectionhead"><div><h2>Learning history</h2><p>Recent events and saved evidence changes.</p></div></div><div class="panel">'+(events.length?events.map(e=>'<div class="activity"><b>'+escapeHtml(e.type)+' · '+escapeHtml(e.code)+'</b><div>'+escapeHtml(e.detail)+'</div><small class="muted">'+escapeHtml(new Date(e.at).toLocaleString())+'</small></div>').join(''):'No course activity recorded yet.')+'</div><div class="panel"><h2>Monthly review</h2><p>On the first Thursday each month: compare planned and actual hours, name the three weakest areas and recompute the calendar. Recalibrate hours after the first two modules and each phase.</p><div class="field"><label for="monthly">This month’s review and plan changes</label><textarea id="monthly">'+escapeHtml(db.monthlyReviews[currentStudyWeek()]||'')+'</textarea></div><button class="btn secondary" data-month-review="'+currentStudyWeek()+'">Save monthly review</button></div>'}

function tutorPage(){const msgs=db.tutor&&db.tutor.messages||[];const preload=db.tutor&&db.tutor.preload,active=moduleByCode(preload&&preload.code)||moduleByCode(activeCode)||moduleByCode((db.last||{}).code)||moduleByCode('B0');return '<div class="modulehead"><div><div class="eyebrow">Genuine model connection · no canned replies</div><h1>Learning tutor</h1><p class="lead">Ask for an explanation, another example, staged hints or a review of your attempt. The tutor follows the roadmap: it should not reveal a full answer before you try, and it never awards mastery.</p></div><span class="pill" id="tutorStatus">'+escapeHtml(tutorStatus)+'</span></div><div class="grid2"><div class="card"><h2>Conversation</h2><div class="chat" id="chat">'+(msgs.length?msgs.map(m=>'<div class="message '+(m.role==='user'?'user':'')+'"><b>'+(m.role==='user'?'You':'Tutor')+'</b><br>'+escapeHtml(m.content)+'</div>').join(''):'<div class="message">No conversation yet. Ask a question after selecting a module context. No response is simulated when the model is unavailable.</div>')+'</div><form id="tutorForm"><div class="field"><label for="tutorInput">Question or attempted work</label><textarea id="tutorInput" required minlength="3" placeholder="What did you try? What result did you expect, and what happened?" style="min-height:90px">'+escapeHtml(preload?preload.text:'')+'</textarea></div><div class="row"><label class="field">Module context<select id="tutorModule">'+allModules.map(m=>'<option value="'+m.code+'" '+(active&&active.code===m.code?'selected':'')+'>'+m.code+' · '+escapeHtml(m.title)+'</option>').join('')+'</select></label><label class="field">Assistance level<select id="tutorLevel">'+LEVELS.slice(0,4).map((l,i)=>'<option value="'+(i+1)+'" '+(preload&&preload.level===i+1?'selected':'')+'>Level '+(i+1)+' · '+l[0]+'</option>').join('')+'<option value="5">Level 5 · assessment in progress</option></select></label></div><button class="btn" type="submit">Ask connected tutor</button><span class="footnote" id="tutorBusy"></span></form></div><aside><div class="card"><h2>Connection status</h2><p id="tutorStatusDetail">'+escapeHtml(tutorStatus)+'</p><button class="quiet" id="checkTutor">Check connection</button><div class="statusbox"><b>Local-first setup</b><br>Run <code>node server.js</code> in this folder. The server uses Ollama on localhost by default. Install Ollama separately and pull a small model you choose; the website never sends an API key or calls a paid API. Without the server and model, tutor requests return a clear unavailable error.</div><p class="footnote">Tutor messages and prompts are saved locally in this browser. Do not submit secrets or real learner records.</p><p><a href="https://docs.ollama.com/" target="_blank" rel="noopener noreferrer">Ollama setup documentation ↗</a></p></div><div class="card"><h3>Review protocol</h3><ol><li>State the task and your attempt.</li><li>Ask for the first hint, not the answer.</li><li>Compare feedback against tests or documentation.</li><li>Record corrections in your bug journal.</li><li>Use a human-reviewed rubric for gates; tutor text is formative only.</li></ol></div></aside></div>'}
function checkTutor(){fetch('/api/health',{cache:'no-store'}).then(r=>r.json()).then(d=>{tutorStatus=d.ready?'Connected · '+d.provider+' · '+d.model:'Server ready, model unavailable';const a=document.getElementById('tutorStatus'),b=document.getElementById('tutorStatusDetail');if(a)a.textContent=tutorStatus;if(b)b.textContent=d.ready?'Local model is reachable. Tutor replies come from the configured model.':'The app server is available but no model responded. Check the local Ollama service and model name.'}).catch(()=>{tutorStatus='Not connected · local model unavailable';const a=document.getElementById('tutorStatus'),b=document.getElementById('tutorStatusDetail');if(a)a.textContent=tutorStatus;if(b)b.textContent='No tutor endpoint responded. Open this site through node server.js and start a local Ollama model. No fake responses are used.'})}
async function sendTutor(event){event.preventDefault();const input=document.getElementById('tutorInput'),text=input.value.trim(),code=document.getElementById('tutorModule').value,level=Number(document.getElementById('tutorLevel').value);if(text.length<3)return;const assessment=(db.gates[code]&&db.gates[code].attempts&&db.gates[code].attempts.at(-1)&&db.gates[code].attempts.at(-1).submitted&&!db.gates[code].attempts.at(-1).reviewed?db.gates[code].attempts.at(-1):db.prechecks[code]&&db.prechecks[code].attempts&&db.prechecks[code].attempts.at(-1)&&db.prechecks[code].attempts.at(-1).submitted&&!db.prechecks[code].attempts.at(-1).reviewed?db.prechecks[code].attempts.at(-1):null);if(level===5&&(!assessment||Object.values(assessment.answers||{}).some(x=>String(x).trim().length<25))){toast('Level 5 is unseen. Submit the complete pre-check or gate attempt before asking for feedback.');return}db.tutor=db.tutor||{messages:[]};db.tutor.messages.push({role:'user',content:text,at:new Date().toISOString()});db.tutor.preload=null;input.value='';save();render();const busy=document.getElementById('tutorBusy');if(busy)busy.textContent='Waiting for the local model…';try{const m=moduleByCode(code);const res=await fetch('/api/tutor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:{code:m.code,title:m.title,topics:m.topics,mechanism:m.mechanism,objectives:m.outcomes},messages:db.tutor.messages.slice(-12).map(x=>({role:x.role,content:x.content})),assistanceLevel:level,attemptSubmitted:level===5?!!assessment:text.length>=25,mode:level===5?'unseen':'lesson'})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Tutor request failed.');db.tutor.messages.push({role:'assistant',content:data.reply,at:new Date().toISOString()});eventLog('Tutor feedback',code,'Model response received; formative feedback only.');save();render()}catch(err){tutorStatus='Tutor unavailable';toast(err.message||'No model response. Your question is saved locally; no function copyBlock(button){const code=button.parentElement.querySelector('code');if(!code)return;navigator.clipboard.writeText(code.textContent).then(()=>{button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200)}).catch(()=>toast('Select the code and copy it manually.'))}
function startAssessment(code,kind){const rec=kind==='precheck'?db.prechecks[code]:db.gates[code];if(!rec){if(kind==='precheck')db.prechecks[code]={attempts:[]};else db.gates[code]={attempts:[]}}if(kind==='precheck'&&db.prechecks[code].attempts.some(a=>a.reviewed))return;const m=moduleByCode(code),record=kind==='precheck'?db.prechecks[code]:db.gates[code],prior=record.attempts.at(-1),parts=kind==='gate'&&prior&&prior.reviewed&&!prior.pass?['explain','debug','modify','justify'].filter(p=>prior.scores[p]<2):['explain','debug','modify','justify'];if(kind==='gate'&&prior&&prior.reviewed&&!prior.pass&&Date.now()<new Date(prior.reviewedAt).getTime()+48*3600000){toast('A retake opens after at least 48 hours of targeted practice.');return}const answers={};for(const p of parts){const input=document.getElementById('assess-'+p);if(!input||input.value.trim().length<25){toast('Write a reasoned response for each required part before submitting.');return}answers[p]=input.value.trim()}const attempt={parts,answers,preservedScores:prior&&prior.scores||{},submitted:true,reviewed:false,submittedAt:new Date().toISOString(),mode:kind};record.attempts.push(attempt);record.submitted=true;record.reviewed=false;eventLog(kind==='precheck'?'Pre-check submitted':'Gate submitted',code,'Four-part evidence saved; independent review pending.');save('Evidence saved; module progression is unchanged until review.');render()}
function recordReview(code,kind){const record=kind==='precheck'?db.prechecks[code]:db.gates[code],attempt=record&&record.attempts.at(-1);if(!attempt||!attempt.submitted||attempt.reviewed){toast('No pending submission to review.');return}if(kind==='gate'&&!gateReady(moduleByCode(code))){toast('Readiness requirements are not complete.');return}const reviewer=document.getElementById('reviewer').value.trim(),confirmReview=document.getElementById('reviewConfirm').checked;if(!reviewer||!confirmReview){toast('Enter a review source and confirm the review is complete.');return}const scores=Object.assign({},attempt.preservedScores||{});for(const p of attempt.parts){const val=document.getElementById('score-'+p).value;if(val===''){toast('Score every submitted part.');return}scores[p]=Number(val)}const total=Object.values(scores).reduce((n,v)=>n+Number(v||0),0),pass=['explain','debug','modify','justify'].every(p=>Number(scores[p])>=2)&&total>=9;const notes=document.getElementById('reviewNotes').value.trim(),at=new Date().toISOString();Object.assign(attempt,{reviewed:true,reviewedAt:at,scores,total,pass,reviewer,notes});Object.assign(record,{reviewed:true,reviewedAt:at,scores,total,pass,reviewer,notes});const m=moduleByCode(code);for(const p of ['explain','debug','modify','justify']){const id=code+'|'+p;let weak=db.weaknesses.find(x=>x.id===id&&!x.cleared);if(Number(scores[p])<2){if(!weak){weak={id,code,part:p,passes:0,cleared:false,createdAt:at};db.weaknesses.push(weak)}weak.note=notes||'Below gate standard; practise the failed requirement with a different problem.';weak.failures=(weak.failures||0)+1;weak.reteachRequired=weak.failures>=2;if(weak.reteachRequired)weak.reteachAfter=at;weak.nextRetest=new Date(new Date(at).getTime()+48*3600000).toISOString()}else if(weak&&attempt.parts.includes(p)){weak.passes++;weak.reteachRequired=false;if(weak.passes>=2)weak.cleared=true;else weak.nextRetest=new Date(new Date(at).getTime()+7*86400000).toISOString()}}
if(pass){for(const p of ['explain','debug','modify','justify']){const prompt=m.outcomes[0]+' · '+p;[1,3,8].forEach(weeks=>{const key=code+'|'+p+'|'+weeks;db.revision[key]={due:new Date(new Date(at).getTime()+weeks*7*86400000).toISOString(),done:false,prompt}})}eventLog(kind==='precheck'?'Pre-check passed':'Mastery gate passed',code,'Reviewed score '+total+'/12 by '+reviewer+'.')}else eventLog(kind==='precheck'?'Pre-check needs teaching':'Gate needs retake',code,'Reviewed score '+total+'/12; targeted practice recorded.');save(pass?'Reviewed result recorded. Prerequisite progression updated.':'Review recorded. Only failed parts are eligible for retake after 48 hours.');render()}
function submitAssessment(code,kind){const m=moduleByCode(code);if(!m){toast('Unknown module.');return}if(kind==='precheck'&&!initialPrecheckAllowed(m)){toast('Pre-check is locked by prerequisites.');return}if(kind==='precheck'&&db.prechecks[code]&&db.prechecks[code].attempts&&db.prechecks[code].attempts.some(a=>a.reviewed)){toast('This pre-check has already been reviewed. Follow its result and continue to the gate.');return}if(kind==='gate'&&!gateReady(m)){toast('Complete the reviewed pre-check, Levels 1–4 with reflections, and project evidence before the gate.');return}startAssessment(code,kind)}
function saveAttempt(code,level){const field=document.getElementById('attempt'),text=field.value.trim();if(text.length<25){toast('Add your attempt and reasoning (at least 25 characters).');return}const key=code+'-'+level;db.attempts[key]=Object.assign(db.attempts[key]||{},{text,at:new Date().toISOString(),review:null,reflection:''});eventLog('Exercise attempted',code,'Level '+level+' attempt saved; not passed.');save('Attempt saved. Request tutor review or compare against tests.');if(page==='module')render()}
function saveReflection(code,level){const field=document.getElementById('reflection'),reflection=field.value.trim(),key=code+'-'+level,rec=db.attempts[key];if(!rec||!rec.text||reflection.length<25){toast('Save an attempt and a specific reflection of at least 25 characters first.');return}rec.reflection=reflection;rec.reflectedAt=new Date().toISOString();eventLog('Exercise reflection',code,'Level '+level+' reflection saved; assistance may reduce, mastery is not implied.');save('Reflection saved. The next assistance level is available.');render()}
function revealHint(code){const level=3,key=code+'-'+level,rec=db.attempts[key]||{text:'',hints:0};rec.hints=Math.min(3,(rec.hints||0)+1);db.attempts[key]=rec;save();render()}
function submitProject(code){const text=document.getElementById('projectEvidence').value.trim();if(text.length<15){toast('Describe the evidence you produced or what remains.');return}db.assignments[code]={text,submitted:true,at:new Date().toISOString(),reviewed:false};eventLog('Assignment submitted',code,'Evidence saved; this does not pass the gate.');save('Assignment evidence saved.');render()}
function updateLessonText(code,key,element){db.lesson[code]=db.lesson[code]||{};db.lesson[code][key]=element.value;db.lesson[code].updatedAt=new Date().toISOString();save()}
function submitDsa(key,pattern,day){const el=document.getElementById('dsaw-'+({Monday:0,Tuesday:1,Thursday:2,Saturday:3}[day])),text=el.value.trim();if(text.length<25){toast('Record an approach, complexity and mistake before saving.');return}db.dsa[key]=Object.assign(db.dsa[key]||{},{text,pattern,day,submitted:true,at:new Date().toISOString()});eventLog('DSA session attempt',pattern,day+' evidence saved with a solution-notebook entry.');save('DSA evidence saved.');render()}
function timerStart(key,duration){if(db.activeTimer&&db.activeTimer.key===key){timerStop();return}if(db.activeTimer)timerStop();db.activeTimer={key,startedAt:Date.now(),planned:Number(duration)};save('Study timer started.');render();startTick()}
function timerStop(){if(!db.activeTimer)return;const t=db.activeTimer,elapsed=Math.max(1,Math.round((Date.now()-t.startedAt)/60000));db.studyLog[t.key]=(db.studyLog[t.key]||0)+elapsed;db.activeTimer=null;eventLog('Study time logged','Week '+t.key.split('-')[0],elapsed+' minutes recorded.');save(elapsed+' study minutes logged.');render()}
let tickHandle=null;function startTick(){clearInterval(tickHandle);tickHandle=setInterval(()=>{const t=db.activeTimer;if(!t){clearInterval(tickHandle);return}const el=document.getElementById('timer-'+t.key);if(el){const sec=Math.max(0,Math.round(t.planned*60-(Date.now()-t.startedAt)/1000));el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+' remaining'}} ,1000)}
function currentModuleTab(t){moduleTab=t;render()}
function resetData(){if(!confirm('Clear new-roadmap attempts, notes, assignments and progress from this browser? The former six-week record remains in its original storage key.'))return;const theme=db.theme;db=freshState();db.theme=theme;try{localStorage.setItem(stateKey,JSON.stringify(db));toast('New-roadmap progress cleared. The old six-week record was preserved.')}catch(_e){toast('Storage unavailable; progress could not be reset.')}render()}
function exportRecord(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),scope:'Fieldnotes new roadmap local record',data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fieldnotes-learning-record.json';a.click();URL.revokeObjectURL(url)}
function saveRevision(key){const el=document.getElementById('revision-'+key),text=el.value.trim();if(text.length<25){toast('Write a retrieval attempt before saving.');return}db.revision[key]=Object.assign(db.revision[key]||{},{text,submitted:true,submittedAt:new Date().toISOString(),reviewed:false});eventLog('Spaced revision attempted',key.split('|')[0],'Attempt saved; review is still pending.');save('Revision attempt saved.');render()}
function recordRevisionReview(key){const item=db.revision[key],reviewer=document.getElementById('revision-reviewer-'+key),score=document.getElementById('revision-pass-'+key);if(!item||!item.submitted||!reviewer.value.trim()||!score.value){toast('Save an attempt and enter an independent review result.');return}item.reviewed=true;item.reviewer=reviewer.value.trim();item.pass=score.value==='yes';item.done=true;item.reviewedAt=new Date().toISOString();const [code,part]=key.split('|'),weak=db.weaknesses.find(x=>x.id===code+'|'+part&&!x.cleared);if(weak){if(item.pass){weak.passes++;if(weak.passes>=2)weak.cleared=true}else{weak.passes=0;weak.nextRetest=new Date(Date.now()+7*86400000).toISOString()}}eventLog('Spaced revision reviewed',code,part+': '+(item.pass?'pass':'needs more practice')+' · '+item.reviewer);save('Revision review saved.');render()}
function saveMonthly(key){db.monthlyReviews[key]=document.getElementById('monthly').value;eventLog('Monthly review','Week '+key,'Review note saved; adjust the rolling plan based on actual evidence.');save('Monthly review saved.');render()}
function planBlocks(){const w=currentStudyWeek();if(!weeksElapsedLight())return DAYS.flatMap((d,di)=>d.blocks.map((b,bi)=>({day:d.day,activity:b[0],minutes:b[1],key:w+'-'+di+'-'+bi})).filter(x=>x.minutes>0));return[{day:'Monday',activity:'Backend · light-week main session',minutes:120,key:w+'-light-main'},{day:'Monday',activity:'DSA · focused review',minutes:30,key:w+'-light-dsa1'},{day:'Thursday',activity:'Backend · weekly assessment',minutes:30,key:w+'-light-assess'},{day:'Saturday',activity:'DSA · spaced retest',minutes:30,key:w+'-light-dsa2'}]}
function attachEvents(){document.addEventListener('click',e=>{if(e.target.id==='shade'){document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');return}const t=e.target.closest('button,[data-page]');if(!t)return;if(t.dataset.page){go(t.dataset.page);return}if(t.id==='theme'){db.theme=db.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=db.theme;save('Theme updated.');return}if(t.id==='reset'){resetData();return}if(t.id==='menu'){const side=document.getElementById('side'),open=side.classList.toggle('open');document.getElementById('shade').classList.toggle('open',open);t.setAttribute('aria-expanded',String(open));t.setAttribute('aria-label',open?'Close navigation':'Open navigation');return}if(t.id==='shade'){document.getElementById('side').classList.remove('open');t.classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');return}if(t.id==='exportData'){exportRecord();return}if(t.id==='checkTutor'){checkTutor();return}if(t.dataset.next){activeCode=t.dataset.next;moduleTab=hasPrecheck(moduleByCode(activeCode))&&!db.prechecks[activeCode]?'precheck':'lesson';go('module');return}if(t.dataset.mtab){moduleTab=t.dataset.mtab;render();return}if(t.dataset.levelTab){activeLevel=Number(t.dataset.levelTab);render();return}if(t.dataset.savePrediction){updateLessonText(t.dataset.savePrediction,'prediction',document.getElementById('predict'));eventLog('Prediction saved',t.dataset.savePrediction,'Prediction stored before running.');save('Prediction saved.');return}if(t.dataset.saveTeach){updateLessonText(t.dataset.saveTeach,'teachback',document.getElementById('teachback'));eventLog('Teach-back saved',t.dataset.saveTeach,'Explanation saved for later review.');save('Teach-back saved.');return}if(t.dataset.saveDebug){saveDebugging(t.dataset.saveDebug);return}if(t.dataset.reviewDebug){db.tutor=db.tutor||{messages:[]};db.tutor.preload={code:t.dataset.reviewDebug,level:4,text:document.getElementById('debugAttempt').value.trim()};activeCode=t.dataset.reviewDebug;page='tutor';render();return}if(t.dataset.submitAttempt){saveAttempt(t.dataset.submitAttempt,Number(t.dataset.level));return}if(t.dataset.reflect){saveReflection(t.dataset.reflect,Number(t.dataset.level));return}if(t.dataset.reviewAttempt){db.tutor=db.tutor||{messages:[]};db.tutor.preload={code:t.dataset.reviewAttempt,level:Number(t.dataset.level),text:document.getElementById('attempt').value.trim()};activeCode=t.dataset.reviewAttempt;page='tutor';render();return}if(t.dataset.hint){revealHint(t.dataset.hint);return}if(t.dataset.submitProject){submitProject(t.dataset.submitProject);return}if(t.dataset.saveCapstone){saveCapstone(t.dataset.saveCapstone);return}if(t.dataset.assessSubmit){submitAssessment(t.dataset.assessSubmit,t.dataset.assessKind);return}if(t.dataset.recordReview){recordReview(t.dataset.recordReview,t.dataset.reviewKind);return}if(t.dataset.dsaPatternIndex!==undefined){selectedDsa=Number(t.dataset.dsaPatternIndex);render();return}if(t.dataset.dsaSubmit){submitDsa(t.dataset.dsaSubmit,t.dataset.dsaPattern,t.dataset.dsaDay);return}if(t.dataset.dsaNote){db.dsa.notebook=db.dsa.notebook||{};db.dsa.notebook[t.dataset.dsaNote]=document.getElementById('dsanote').value;eventLog('DSA notebook',t.dataset.dsaNote,'Reflection saved.');save('Notebook entry saved.');render();return}if(t.dataset.timer){timerStart(t.dataset.timer,Number(t.dataset.duration));return}if(t.dataset.logMins){const el=document.getElementById('mins-'+t.dataset.logMins),n=Number(el.value);if(!Number.isFinite(n)||n<1||n>360){toast('Log between 1 and 360 minutes.');return}db.studyLog[t.dataset.logMins]=(db.studyLog[t.dataset.logMins]||0)+Math.round(n);eventLog('Study time logged','Week '+t.dataset.logMins.split('-')[0],Math.round(n)+' minutes recorded manually.');save('Study time logged.');render();return}if(t.dataset.weeklyAssess){saveWeeklyAssessment(t.dataset.weeklyAssess);return}if(t.dataset.journal){db.weeklyJournal=db.weeklyJournal||{};db.weeklyJournal[t.dataset.journal]=document.getElementById('weekreview').value;eventLog('Weekly journal','Week '+t.dataset.journal,'Journal saved.');save('Weekly journal saved.');render();return}if(t.dataset.revision){saveRevision(t.dataset.revision);return}if(t.dataset.monthReview){saveMonthly(t.dataset.monthReview);return}if(t.dataset.revisionReview){recordRevisionReview(t.dataset.revisionReview);return}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-session]')){db.sessions[el.dataset.session]=el.checked;eventLog(el.checked?'Planned session recorded':'Planned session unchecked','Week '+el.dataset.session.split('-')[0],el.checked?'Self-recorded session completion.':'Completion record removed.');save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='tutorForm'){sendTutor(e);return} });document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}})}
function init(){document.documentElement.dataset.theme=db.theme||'light';if(db.activeTimer){const t=db.activeTimer;if(Date.now()-t.startedAt>t.planned*60000)db.activeTimer=null}attachEvents();render()}
init();
</script></body></html>
